[package]
name = "albas"
version = "1.10.0"
description = "To-do list and calendar"
authors = ["Daniel Poprawski"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "albas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# "json" powers the sync client's request/response bodies; serde_json was
# already in the tree, so this pulls in no new crates.
ureq = { version = "2", features = ["json"] }
tauri-plugin-barcode-scanner = "2"

# The keyring crate has no Android backend, so the sync token falls back to the
# app-private SQLite file there. See src/token_store.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# To reach past PlatformWebview::inner() and flip a WebKitSettings flag (see
# lib.rs run()). Pinned to the same "2.0" line wry already locks so it reuses
# that resolved version instead of pulling in a second copy of the crate.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

