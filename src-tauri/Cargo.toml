[package]
name = "albas"
version = "1.10.0"
description = "To-do list and calendar"
authors = ["Daniel Poprawski"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "albas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# In-app passkey ceremonies (Linux CTAP2 USB keys, Android Credential Manager).
# v0.2.0 does not compile against webauthn-rs-proto >= 0.5.2 (CredProps.rk became
# Option<bool>), so Cargo.lock pins webauthn-authenticator-rs/-proto to 0.5.1 —
# a plain `cargo update` will break the build until the plugin releases a fix.
tauri-plugin-webauthn = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# "json" powers the sync client's request/response bodies; serde_json was
# already in the tree, so this pulls in no new crates.
ureq = { version = "2", features = ["json"] }
# Wyze request signing: md5(md5(md5(pw))) for login, HMAC-MD5 for signature2.
md-5 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }

# The keyring crate has no Android backend, so credentials fall back to the
# app-private SQLite file there. See the note in src/wyze.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

