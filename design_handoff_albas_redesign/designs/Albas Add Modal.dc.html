<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; color: #1a202c; background: #eef1f5; }
    input, textarea, button { font-family: inherit; }
    input[type="date"], input[type="time"] { color-scheme: light; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes rowIn { from { opacity: 0; transform: translateY(-4px); max-height: 0; } to { opacity: 1; transform: none; max-height: 240px; } }
  </style>
</helmet>
<div style="position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 32px 32px 32px; background: rgba(26, 32, 44, .38); backdrop-filter: blur(3px);">
  <div style="{{ cardStyle }}">
   <div ref="{{ innerRef }}" style="max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0 20px;">
      <div style="font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -.01em;">{{ headerTitle }}</div>
      <button style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #9ca3af; cursor: pointer; transition: all .15s;" style-hover="background: #f3f4f6; color: #1a202c;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 5l14 14M19 5L5 19"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 14px 20px 0 20px; border: 1px solid #e5e7eb; background: #f8fafb;">
      <sc-for list="{{ typeSegs }}" as="seg" hint-placeholder-count="3">
        <button style="{{ seg.style }}" onClick="{{ seg.onClick }}">{{ seg.label }}</button>
      </sc-for>
    </div>

    <div style="padding: 18px 20px 4px 20px; display: flex; flex-direction: column; gap: 14px;">

      <input value="{{ title }}" onInput="{{ onTitle }}" placeholder="{{ titlePlaceholder }}" style="width: 100%; font-size: 18px; font-weight: 500; color: #1a202c; background: transparent; border: none; border-bottom: 2px solid #e5e7eb; padding: 4px 0 8px 0; outline: none; transition: border-color .15s;" style-focus="border-bottom-color: #a855f7;" />

      <sc-if value="{{ isEvent }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #f8fafb; border: 1px solid #e5e7eb; animation: rowIn .2s ease both;">
          <div style="display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px;">
            <span style="font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Starts</span>
            <input type="date" value="2026-08-12" style="width: 100%; font-size: 13px; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 7px 9px; outline: none;" style-focus="border-color: #a855f7;" />
            <sc-if value="{{ showTimes }}" hint-placeholder-val="{{ true }}">
              <input type="time" value="12:00" style="font-size: 13px; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 7px 9px; outline: none;" style-focus="border-color: #a855f7;" />
            </sc-if>
          </div>
          <div style="display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px;">
            <span style="font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Ends</span>
            <input type="date" value="2026-08-12" style="width: 100%; font-size: 13px; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 7px 9px; outline: none;" style-focus="border-color: #a855f7;" />
            <sc-if value="{{ showTimes }}" hint-placeholder-val="{{ true }}">
              <input type="time" value="13:00" style="font-size: 13px; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 7px 9px; outline: none;" style-focus="border-color: #a855f7;" />
            </sc-if>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isHabit }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Repeats</span>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid #e5e7eb; background: #f8fafb;">
            <sc-for list="{{ freqOpts }}" as="opt" hint-placeholder-count="3">
              <button style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ on.due }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Due</span>
          <input type="date" value="2026-08-12" style="flex: 1; font-size: 13px; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 7px 9px; outline: none;" style-focus="border-color: #a855f7;" />
          <button onClick="{{ rm.due }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.allday }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">All-day</span>
          <button onClick="{{ toggleAllDay }}" style="{{ allDayStyle }}"><span style="{{ allDayKnob }}"></span></button>
          <div style="flex: 1;"></div>
          <button onClick="{{ rm.allday }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.repeat }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Repeat</span>
          <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; border: 1px solid #e5e7eb; background: #f8fafb;">
            <sc-for list="{{ repeatOpts }}" as="opt" hint-placeholder-count="4">
              <button style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ rm.repeat }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.priority }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Priority</span>
          <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid #e5e7eb; background: #f8fafb;">
            <sc-for list="{{ priorityOpts }}" as="opt" hint-placeholder-count="3">
              <button style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ rm.priority }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.category }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">List</span>
          <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{ categoryOpts }}" as="opt" hint-placeholder-count="5">
              <button style="{{ opt.style }}" onClick="{{ opt.onClick }}"><span style="{{ opt.dot }}"></span>{{ opt.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ rm.category }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.target }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Target</span>
          <div style="display: flex; align-items: center; border: 1px solid #e5e7eb;">
            <button onClick="{{ decTarget }}" style="width: 30px; height: 30px; background: #ffffff; border: none; border-right: 1px solid #e5e7eb; color: #6b7280; font-size: 15px; cursor: pointer;" style-hover="background: #f3f4f6; color: #a855f7;">−</button>
            <span style="min-width: 74px; text-align: center; font-size: 13px; font-weight: 500;">{{ targetLabel }}</span>
            <button onClick="{{ incTarget }}" style="width: 30px; height: 30px; background: #ffffff; border: none; border-left: 1px solid #e5e7eb; color: #6b7280; font-size: 15px; cursor: pointer;" style-hover="background: #f3f4f6; color: #a855f7;">+</button>
          </div>
          <div style="flex: 1;"></div>
          <button onClick="{{ rm.target }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.reminder }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: flex-start; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; padding-top: 6px; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Remind</span>
          <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{ reminderOpts }}" as="opt" hint-placeholder-count="4">
              <button style="{{ opt.style }}" onClick="{{ opt.onClick }}">{{ opt.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ rm.reminder }}" style="width: 22px; height: 22px; margin-top: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.color }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Color</span>
          <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 7px;">
            <sc-for list="{{ colorOpts }}" as="opt" hint-placeholder-count="8">
              <button style="{{ opt.style }}" onClick="{{ opt.onClick }}"></button>
            </sc-for>
          </div>
          <button onClick="{{ rm.color }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.location }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Where</span>
          <input placeholder="Room, address or link" style="flex: 1; font-size: 13px; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 8px 9px; outline: none;" style-focus="border-color: #a855f7;" />
          <button onClick="{{ rm.location }}" style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ on.desc }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: flex-start; gap: 10px; animation: rowIn .2s ease both;">
          <span style="width: 74px; flex-shrink: 0; padding-top: 8px; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px;">Notes</span>
          <textarea placeholder="Details, links…" rows="3" style="flex: 1; font-size: 13px; line-height: 1.5; color: #1a202c; background: #ffffff; border: 1px solid #e5e7eb; padding: 8px 9px; outline: none; resize: vertical;" style-focus="border-color: #a855f7;"></textarea>
          <button onClick="{{ rm.desc }}" style="width: 22px; height: 22px; margin-top: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #c3c8d0; cursor: pointer;" style-hover="color: #1a202c;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 0 16px 0;">
        <sc-for list="{{ chips }}" as="chip" hint-placeholder-count="5">
          <button onClick="{{ chip.onClick }}" style="display: flex; align-items: center; gap: 5px; padding: 5px 10px; font-size: 12px; font-weight: 500; color: #6b7280; background: transparent; border: 1px dashed #d1d5db; cursor: pointer; transition: all .15s;" style-hover="color: #a855f7; border-color: #a855f7; background: #faf5ff; border-style: solid;">
            <span style="font-size: 13px; line-height: 1;">+</span>{{ chip.label }}
          </button>
        </sc-for>
      </div>
    </div>

    <div style="position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 20px; border-top: 1px solid #f1f5f9; background: #ffffff;">
      <span style="font-size: 11px; color: #c3c8d0;">{{ hint }}</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button style="padding: 9px 14px; font-size: 13px; font-weight: 500; color: #6b7280; background: transparent; border: none; cursor: pointer; transition: color .15s;" style-hover="color: #1a202c;">Cancel</button>
        <button style="{{ submitStyle }}">{{ submitLabel }}</button>
      </div>
    </div>
   </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:720},&quot;snappiness&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
const CATALOG = {
  event: [
    { key: 'allday', label: 'All-day' },
    { key: 'repeat', label: 'Repeat' },
    { key: 'reminder', label: 'Reminder' },
    { key: 'location', label: 'Location' },
    { key: 'color', label: 'Color' },
    { key: 'desc', label: 'Description' }
  ],
  task: [
    { key: 'due', label: 'Due date' },
    { key: 'priority', label: 'Priority' },
    { key: 'category', label: 'List' },
    { key: 'reminder', label: 'Reminder' },
    { key: 'desc', label: 'Description' }
  ],
  habit: [
    { key: 'target', label: 'Daily target' },
    { key: 'reminder', label: 'Reminder' },
    { key: 'color', label: 'Color' },
    { key: 'desc', label: 'Description' }
  ]
};

const PALETTE = ['#a855f7', '#3b82f6', '#14b8a6', '#22c55e', '#f59e0b', '#ef4444', '#ec4899', '#6b7280'];
const CATEGORIES = [
  { label: 'Work', color: '#3b82f6' },
  { label: 'Personal', color: '#a855f7' },
  { label: 'Shopping', color: '#f59e0b' },
  { label: 'Health', color: '#22c55e' },
  { label: 'Finance', color: '#14b8a6' }
];
const PLACEHOLDERS = {
  event: 'Team sync, dentist, flight…',
  task: 'What needs doing?',
  habit: 'Read, run, meditate…'
};

class Component extends DCLogic {
  state = {
    type: 'event',
    title: '',
    on: { event: {}, task: {}, habit: {} },
    allDay: false,
    repeat: 'Daily',
    priority: 'Normal',
    category: 'Personal',
    freq: 'Daily',
    target: 1,
    color: '#a855f7',
    reminders: { '10 min': true }
  };

  set(patch) { this.setState(patch); }

  // PD (spring) controller driving the card's height — top stays pinned, bottom moves.
  measure() {
    const el = this.inner;
    if (!el) return;
    const target = Math.min(el.scrollHeight, Math.round(window.innerHeight * 0.88));
    if (target === this.target) return;
    this.target = target;
    if (this.h == null) { this.h = target; this.v = 0; this.setState({ h: target }); return; }
    this.tick();
  }

  tick() {
    if (this.raf) return;
    const k = 190 * (this.props.snappiness ?? 1);
    const d = 2 * Math.sqrt(k) * 0.92;
    this.last = performance.now();
    const step = now => {
      const dt = Math.min(0.032, (now - this.last) / 1000);
      this.last = now;
      const err = this.target - this.h;
      this.v += (k * err - d * this.v) * dt;
      this.h += this.v * dt;
      if (Math.abs(this.target - this.h) < 0.4 && Math.abs(this.v) < 6) {
        this.h = this.target; this.v = 0; this.raf = null;
        this.setState({ h: this.h });
        return;
      }
      this.setState({ h: this.h });
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }

  componentDidMount() {
    this.h = null; this.v = 0; this.target = null;
    if (typeof ResizeObserver !== 'undefined') {
      this.ro = new ResizeObserver(() => this.measure());
      if (this.inner) this.ro.observe(this.inner);
    }
    this.measure();
  }

  componentDidUpdate() { this.measure(); }

  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
  }

  addOn(key) {
    this.setState(s => {
      const on = Object.assign({}, s.on);
      on[s.type] = Object.assign({}, on[s.type], { [key]: true });
      return { on };
    });
  }

  removeOn(key) {
    this.setState(s => {
      const on = Object.assign({}, s.on);
      const t = Object.assign({}, on[s.type]);
      delete t[key];
      on[s.type] = t;
      return { on };
    });
  }

  seg(active) {
    return 'padding: 9px 4px; font-size: 13px; font-weight: ' + (active ? '600' : '500') +
      '; font-family: Outfit, sans-serif; color: ' + (active ? '#ffffff' : '#6b7280') +
      '; background: ' + (active ? '#a855f7' : 'transparent') +
      '; border: none; cursor: pointer; transition: all .15s;';
  }

  pill(active, color) {
    const c = color || '#a855f7';
    return 'display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 12px; font-weight: 500; font-family: Outfit, sans-serif; cursor: pointer; transition: all .15s; color: ' +
      (active ? '#1a202c' : '#6b7280') + '; background: ' + (active ? '#faf5ff' : '#ffffff') +
      '; border: 1px solid ' + (active ? c : '#e5e7eb') + ';';
  }

  renderVals() {
    const s = this.state;
    const on = s.on[s.type];
    const mk = (label, active, fn) => ({ label, style: this.seg(active), onClick: fn });

    const rm = {};
    CATALOG[s.type].forEach(c => { rm[c.key] = () => this.removeOn(c.key); });

    const canSubmit = s.title.trim().length > 0;
    const typeName = s.type === 'event' ? 'event' : s.type === 'task' ? 'task' : 'habit';

    const cardBase = 'width: 470px; background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 30px 70px rgba(15, 23, 42, .22); animation: modalIn .22s cubic-bezier(.2,.8,.3,1) both;';

    return {
      innerRef: el => {
        this.inner = el;
        if (el && this.ro) { this.ro.disconnect(); this.ro.observe(el); }
      },
      cardStyle: cardBase + (s.h != null ? ' height: ' + Math.round(s.h) + 'px; overflow: hidden;' : ''),
      headerTitle: s.type === 'event' ? 'New event' : s.type === 'task' ? 'New task' : 'New habit',
      titlePlaceholder: PLACEHOLDERS[s.type],
      title: s.title,
      onTitle: e => this.set({ title: e.target.value }),
      isEvent: s.type === 'event',
      isHabit: s.type === 'habit',
      showTimes: !(s.on.event.allday && s.allDay),
      on: on,
      rm: rm,
      chips: CATALOG[s.type].filter(c => !on[c.key]).map(c => ({
        label: c.label, onClick: () => this.addOn(c.key)
      })),
      typeSegs: [
        mk('Event', s.type === 'event', () => this.set({ type: 'event' })),
        mk('Task', s.type === 'task', () => this.set({ type: 'task' })),
        mk('Habit', s.type === 'habit', () => this.set({ type: 'habit' }))
      ],
      repeatOpts: ['Daily', 'Weekly', 'Monthly', 'Yearly'].map(v => mk(v, s.repeat === v, () => this.set({ repeat: v }))),
      priorityOpts: ['Low', 'Normal', 'High'].map(v => mk(v, s.priority === v, () => this.set({ priority: v }))),
      freqOpts: ['Daily', 'Weekdays', 'Weekly'].map(v => mk(v, s.freq === v, () => this.set({ freq: v }))),
      categoryOpts: CATEGORIES.map(c => ({
        label: c.label,
        style: this.pill(s.category === c.label, c.color),
        dot: 'width: 7px; height: 7px; flex-shrink: 0; background: ' + c.color + ';',
        onClick: () => this.set({ category: c.label })
      })),
      reminderOpts: ['At time', '10 min', '1 hour', '1 day'].map(v => ({
        label: v,
        style: this.pill(!!s.reminders[v]),
        onClick: () => this.setState(st => {
          const r = Object.assign({}, st.reminders);
          if (r[v]) delete r[v]; else r[v] = true;
          return { reminders: r };
        })
      })),
      colorOpts: PALETTE.map(c => ({
        style: 'width: 20px; height: 20px; background: ' + c + '; border: none; cursor: pointer; outline-offset: 2px; outline: ' +
          (s.color === c ? '2px solid #1a202c' : '2px solid transparent') + '; transition: outline-color .15s;',
        onClick: () => this.set({ color: c })
      })),
      allDayStyle: 'position: relative; width: 36px; height: 20px; padding: 0; border: none; cursor: pointer; transition: background .18s; background: ' +
        (s.allDay ? '#a855f7' : '#e5e7eb') + ';',
      allDayKnob: 'position: absolute; top: 3px; left: ' + (s.allDay ? '19px' : '3px') +
        '; width: 14px; height: 14px; background: #ffffff; transition: left .18s cubic-bezier(.2,.8,.3,1);',
      toggleAllDay: () => this.set({ allDay: !s.allDay }),
      targetLabel: s.target + (s.target === 1 ? ' time / day' : ' times / day'),
      incTarget: () => this.set({ target: Math.min(12, s.target + 1) }),
      decTarget: () => this.set({ target: Math.max(1, s.target - 1) }),
      hint: canSubmit ? 'Enter to save' : '',
      submitLabel: 'Add ' + typeName,
      submitStyle: 'padding: 9px 18px; font-size: 13px; font-weight: 600; font-family: Outfit, sans-serif; color: #ffffff; border: none; transition: all .15s; background: ' +
        (canSubmit ? '#a855f7' : '#e5e7eb') + '; color: ' + (canSubmit ? '#ffffff' : '#9ca3af') +
        '; cursor: ' + (canSubmit ? 'pointer' : 'not-allowed') + ';'
    };
  }
}

</script>
</body>
</html>
