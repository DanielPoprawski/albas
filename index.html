<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Icons are lucide-react as of v1.7.1 — inline SVG, bundled, no webfont.
         Inter is all that's left to fetch. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Albas</title>
    <script>
      // Paint the saved theme before React mounts. SQLite is the source of
      // truth, but reading it is async — this mirror avoids a flash of dark.
      try {
        var t = localStorage.getItem('albas-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
