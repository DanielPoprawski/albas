<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/albas-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- No webfont is fetched. Icons are inline lucide SVG, and the redesign's
         two faces (Outfit, Sora) are self-hosted from public/ — see the
         @font-face pair in src/App.css. Inter survives only as a fallback in
         the stack, so there is nothing left to download. -->
    <title>Albas</title>
    <script>
      // Paint the saved theme before React mounts. SQLite is the source of
      // truth, but reading it is async — this mirror avoids a flash of the
      // wrong palette.
      //
      // The stored value is the user's *preference* — 'light', 'dark', or
      // 'system' (follow the OS) — mirrored by applyTheme() in
      // src/appearance.ts; anything else (an install that last ran the
      // four-theme build: 'grey-high'/'grey-low') is treated as 'system', the
      // same fallback readThemePref() reaches a few milliseconds later.
      try {
        var t = localStorage.getItem('albas-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        // Settings › Appearance, pre-derived by applyAppearance() in
        // src/appearance.ts: custom properties for the accent and
        // font, plus the root font size. Same first-paint reasoning as above.
        var a = JSON.parse(localStorage.getItem('albas-appearance') || 'null');
        if (a && a.vars) {
          for (var k in a.vars) {
            if (/^--t-(accent|font)/.test(k)) document.documentElement.style.setProperty(k, a.vars[k]);
          }
          if (typeof a.fontSize === 'string') document.documentElement.style.fontSize = a.fontSize;
        }
        // Sidebar / right-panel widths (Phase L), pre-derived and clamped by
        // applyLayout() in src/appearance.ts — same first-paint
        // reasoning as the appearance mirror above, so a drag survives a
        // restart without the layout jumping once React mounts.
        var l = JSON.parse(localStorage.getItem('albas-layout') || 'null');
        if (l) {
          for (var lk in l) {
            if (/^--layout-(sidebar|right)-w$/.test(lk)) document.documentElement.style.setProperty(lk, l[lk]);
          }
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
