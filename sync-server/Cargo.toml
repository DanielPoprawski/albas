[package]
name = "albas-sync"
version = "0.2.0"
edition = "2021"
description = "Dumb row-store sync endpoint for Albas"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
# conditional-ui unlocks the discoverable (usernameless) authentication API
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
# Password hashing. RustCrypto's Argon2id with the default params; never
# hand-roll this, and never swap it for a plain SHA — `token_hash` above is for
# high-entropy tokens, which is a different problem from a chosen password.
argon2 = "0.5"
# TOTP secret generation, otpauth:// URI construction, and code verification.
# The QR code is rendered client-side from the URI, so no image crate here.
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

[profile.release]
strip = true
lto = true
