[package]
name = "albas-sync"
version = "0.1.0"
edition = "2021"
description = "Dumb row-store sync endpoint for Albas"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
# conditional-ui unlocks the discoverable (usernameless) authentication API
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }

[profile.release]
strip = true
lto = true
