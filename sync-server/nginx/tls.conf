# Step 2 of 2: the real config, once certbot has issued the certificate.
server {
    listen 80;
    server_name albas-api.danni-dev.com;

    # Kept on :80 so `certbot renew` can revalidate without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name albas-api.danni-dev.com;

    ssl_certificate     /etc/letsencrypt/live/albas-api.danni-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albas-api.danni-dev.com/privkey.pem;

    # A first sync from a device with a lot of history is one large POST;
    # nginx's 1m default would reject it as 413.
    client_max_body_size 32m;

    location / {
        proxy_pass http://albas-sync:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
