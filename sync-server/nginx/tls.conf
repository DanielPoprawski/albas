# Step 2 of 2: the real config, once certbot has issued the certificate.
#
# One origin serves everything: the JSON API under /api, the web console at /,
# and Android's assetlinks at the root. That is deliberate — it makes the
# console same-origin (so no CORS layer is ever needed) and puts the WebAuthn
# relying party on this exact host, rather than on the danni-dev.com apex where
# an Albas passkey would also be offerable to every other subdomain.

# `limit_req_zone` is an http-level directive; this file is dropped into
# nginx's http{} block via conf.d (see docker-compose.nginx.yml), so it can
# live here at the top rather than in nginx.conf itself. 10r/m per IP with a
# burst of 20 mirrors the in-process limit `tower_governor` already applies in
# main.rs — this is the second, independent layer in front of it: it stops
# abusive traffic before it even reaches albas-sync, and keeps working even if
# the app's own limiter were ever misconfigured or bypassed.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# The app-session handoff is polled by design (the app asks every few seconds
# for up to five minutes), so it gets its own zone: sharing `auth` let one
# pending sign-in drain the budget the browser on the same IP needed for
# /api/login/. The nonce is 256 random bits, so the looser rate costs nothing
# against guessing. Mirrors the second `governor(...)` in main.rs.
limit_req_zone $binary_remote_addr zone=poll:10m rate=30r/m;

server {
    listen 80;
    server_name albas.danni-dev.com;

    # Kept on :80 so `certbot renew` can revalidate without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name albas.danni-dev.com;

    ssl_certificate     /etc/letsencrypt/live/albas.danni-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albas.danni-dev.com/privkey.pem;

    # A first sync from a device with a lot of history is one large POST;
    # nginx's 1m default would reject it as 413.
    client_max_body_size 32m;

    # Baseline security headers for every response from this origin. `always`
    # so they are still sent on error responses (4xx/5xx), not just 2xx.
    # `add_header` does not inherit into a location that sets its own (nginx's
    # usual gotcha), so the `location ~ "^/chunk-..."` block below — the only
    # other place that sets an `add_header` — repeats these explicitly.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Android's Credential Manager fetches this from the domain root and will
    # not follow it anywhere else, so it is matched exactly and proxied to the
    # app (which serves ALBAS_SYNC_ASSETLINKS verbatim).
    location = /.well-known/assetlinks.json {
        proxy_pass http://albas-sync:8787/.well-known/assetlinks.json;
        proxy_set_header Host $host;
    }

    # The trailing slash on proxy_pass strips the /api prefix, so the server's
    # routes stay exactly as written in main.rs — it sees /sync, /login/start,
    # /shares and so on. Changing this to a slashless proxy_pass would break
    # every endpoint at once.
    location /api/ {
        proxy_pass http://albas-sync:8787/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The nginx-level half of rate limiting (see the `limit_req_zone` comment
    # above) — one `location` per auth-ish prefix, each more specific than
    # `/api/` above so it wins. `nodelay` rejects immediately past the burst
    # instead of queueing, matching the 429 the app's own limiter would give.
    location /api/login/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://albas-sync:8787/login/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/register/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://albas-sync:8787/register/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/totp/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://albas-sync:8787/totp/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # `/api/app-session` (open a session) and `/api/app-session/...` (claim,
    # poll) both need the limit — two locations rather than one prefix
    # without a trailing slash, so this can't also swallow some unrelated
    # future `/api/app-sessions-whatever` route.
    location = /api/app-session {
        limit_req zone=poll burst=30 nodelay;
        proxy_pass http://albas-sync:8787/app-session;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/app-session/ {
        limit_req zone=poll burst=30 nodelay;
        proxy_pass http://albas-sync:8787/app-session/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The public site (web/), built with `bun run build` and copied to
    # ./web on this host. Deliberately not proxied to albas-sync: a stray
    # browser request must never be mistaken for an API call, and the /api/
    # and assetlinks locations above are both more specific, so they still win.
    location / {
        root /srv/albas;
        # /login and /register are client-side routes with no file behind
        # them: anything that is not a real file falls through to index.html
        # for the router to resolve.
        try_files $uri /index.html;

        # The portal is a small, self-contained React app: no third-party
        # scripts, no inline event handlers, no inline styles — everything is
        # a class in the one same-origin stylesheet, so `style-src 'self'`
        # holds without 'unsafe-inline' (web/CLAUDE.md, "Theming"). `frame-ancestors
        # 'none'` is the modern replacement for X-Frame-Options and covers
        # what it doesn't (cross-origin `<iframe>` embedding of any page here).
        # `font-src` needs `data:`: Bun's bundler inlines the self-hosted
        # Outfit/Sora faces (web/src/index.css) as `url(data:font/ttf;...)`
        # rather than writing separate hashed files — same origin in spirit,
        # but CSP treats `data:` as its own source that `'self'` does not
        # cover, so it must be listed explicitly or the faces fail to load.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
    }

    # Content-hashed filenames, so these can never go stale. index.html is
    # excluded on purpose — it is what points at the current hashes.
    location ~ "^/chunk-[a-z0-9]+\.(js|css|map)$" {
        root /srv/albas;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated here (see the server-level comment above) because this
        # location already sets its own add_header, which stops the
        # server-level ones from inheriting in.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
    }
}
