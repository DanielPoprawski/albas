# Step 2 of 2: the real config, once certbot has issued the certificate.
#
# One origin serves everything: the JSON API under /api, the web console at /,
# and Android's assetlinks at the root. That is deliberate — it makes the
# console same-origin (so no CORS layer is ever needed) and puts the WebAuthn
# relying party on this exact host, rather than on the danni-dev.com apex where
# an Albas passkey would also be offerable to every other subdomain.
server {
    listen 80;
    server_name albas.danni-dev.com;

    # Kept on :80 so `certbot renew` can revalidate without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name albas.danni-dev.com;

    ssl_certificate     /etc/letsencrypt/live/albas.danni-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albas.danni-dev.com/privkey.pem;

    # A first sync from a device with a lot of history is one large POST;
    # nginx's 1m default would reject it as 413.
    client_max_body_size 32m;

    # Android's Credential Manager fetches this from the domain root and will
    # not follow it anywhere else, so it is matched exactly and proxied to the
    # app (which serves ALBAS_SYNC_ASSETLINKS verbatim).
    location = /.well-known/assetlinks.json {
        proxy_pass http://albas-sync:8787/.well-known/assetlinks.json;
        proxy_set_header Host $host;
    }

    # The trailing slash on proxy_pass strips the /api prefix, so the server's
    # routes stay exactly as written in main.rs — it sees /sync, /login/start,
    # /shares and so on. Changing this to a slashless proxy_pass would break
    # every endpoint at once.
    location /api/ {
        proxy_pass http://albas-sync:8787/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The web console lands here. Until it is built, nothing is served at the
    # root — deliberately a 404 rather than a proxy to the app, so a stray
    # browser request can never be mistaken for an API call.
    location / {
        return 404;
    }
}
