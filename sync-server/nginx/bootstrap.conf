# Step 1 of 2: HTTP only, so nginx can start before a certificate exists
# (a 443 block referencing a missing cert file makes nginx refuse to boot).
# Copy to nginx/conf.d/albas.conf, get the cert, then swap in tls.conf.
server {
    listen 80;
    server_name albas.danni-dev.com;

    # Let's Encrypt HTTP-01. This prefix location is more specific than "/",
    # so it wins for challenges only — everything else still reaches the app.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Android requires assetlinks at the domain ROOT, so it cannot live under
    # /api like the rest of the API does.
    location = /.well-known/assetlinks.json {
        proxy_pass http://albas-sync:8787/.well-known/assetlinks.json;
        proxy_set_header Host $host;
    }

    # The trailing slash on proxy_pass strips the /api prefix, so the server's
    # own routes are unchanged — it still sees /sync, /login/start and so on.
    location /api/ {
        proxy_pass http://albas-sync:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
