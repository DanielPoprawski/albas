# Step 1 of 2: HTTP only, so nginx can start before a certificate exists
# (a 443 block referencing a missing cert file makes nginx refuse to boot).
# Copy to nginx/conf.d/albas.conf, get the cert, then swap in tls.conf.
server {
    listen 80;
    server_name albas-api.danni-dev.com;

    # Let's Encrypt HTTP-01. This prefix location is more specific than "/",
    # so it wins for challenges only — /.well-known/assetlinks.json still
    # falls through to the app, which is what Android passkeys need.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://albas-sync:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
