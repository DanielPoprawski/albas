# Overlay putting nginx + Let's Encrypt in front of albas-sync:
#
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# nginx reaches the server over the compose network as http://albas-sync:8787,
# so the base file's 127.0.0.1:8787 publish stays local-only.
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # The built public site. Relative to this file, so it is the repo's own
      # web/dist — the same path the build writes to locally, which keeps the
      # rsync destination identical to the source. tls.conf serves it from
      # /srv/albas. Not in git (dist/ is ignored); rsync it in.
      - ../web/dist:/srv/albas:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - albas-sync

  # Not started by `up` — invoked on demand with `docker compose run --rm certbot ...`
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  certbot-etc:
  certbot-www:
